name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q
      # The read-only surface is a safety control, so prove it holds from the
      # CLI as well as from unit tests — a mutating command must exit non-zero.
      - name: Read-only surface refuses mutations
        run: |
          python -m csa.cli check sinfo -N
          if python -m csa.cli check scontrol update NodeName=ALL State=DRAIN; then
            echo "::error::guard allowed a state-changing command"; exit 1
          fi
          if python -m csa.cli check scancel 1; then
            echo "::error::guard allowed scancel"; exit 1
          fi
