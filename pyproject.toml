[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "csa"
version = "0.2.0"
description = "Slurm dependency graph and read-only tool guard for a planned multi-agent diagnosis ablation (no agent yet)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zhanyl Abdybaeva" }]
dependencies = ["click>=8.1"]

[project.optional-dependencies]
# pyyaml is test-only: it reads the vendored slurm-rca-bench snapshot.
# No LLM extra is declared: nothing imports an LLM or MCP SDK yet, and a
# dependency range with no code behind it is an untested claim.
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.8",
  "ruff>=0.5",
  "pyyaml>=6.0",
  "types-PyYAML",
]

[project.scripts]
csa = "csa.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/csa"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Verbatim copies of another repository, checked by hash; not ours to lint.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PTH", "S"]

[tool.ruff.lint.per-file-ignores]
# S101: assert is how pytest tests. S108: the tests name attacker paths such
# as /tmp/evil/sinfo as *data* to prove they are refused; nothing is written.
"tests/*" = ["S101", "S108"]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts"]
exclude = ["^tests/fixtures/"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["csa"]

[tool.coverage.report]
# Measured at 98% (line + branch) when this gate was added; 95% leaves room for
# a defensive branch without letting whole modules go untested again (the CLI
# was at 0%). Applies whenever pytest runs with --cov, as CI and `make test` do.
fail_under = 95
show_missing = true
skip_covered = true
