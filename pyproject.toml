[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "csa"
version = "0.1.0"
description = "Multi-agent Slurm cluster diagnosis, measured against slurm-rca-bench"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zhanyl Abdybaeva" }]
dependencies = ["pyyaml>=6.0", "click>=8.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.8", "ruff>=0.5", "types-PyYAML"]
llm = ["anthropic>=0.40", "mcp>=1.2"]

[project.scripts]
csa = "csa.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/csa"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PTH", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
